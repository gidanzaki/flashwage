[package]
name = "flashwage-escrow"
version = "0.1.0"
edition = "2021"
description = "FlashWage milestone escrow contract for Stellar/Soroban gig payouts"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "27.0.6"

[dev-dependencies]
soroban-sdk = { version = "27.0.6", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
